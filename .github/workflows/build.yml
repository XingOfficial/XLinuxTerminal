name: Build Signed APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Generate debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
        KEYSTORE_PASSWORD: android
        KEY_ALIAS: androiddebugkey
        KEY_PASSWORD: android
    - name: Sign APK
      run: |
        for f in app/build/outputs/apk/release/*.apk; do
          if [ -f "$f" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass android "$f" androiddebugkey
            zipalign -v 4 "$f" "${f%.apk}-aligned.apk"
            mv "${f%.apk}-aligned.apk" "$f"
          fi
        done
    - name: Rename APK with version and date
      run: |
        VERSION=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
        DATE=$(date +%Y%m%d_%H%M%S)
        mkdir -p app/build/outputs/apk/release/renamed
        for f in app/build/outputs/apk/release/*.apk; do
          if [ -f "$f" ] && [[ "$f" != *"unaligned"* ]]; then
            cp "$f" "app/build/outputs/apk/release/renamed/XLinuxTerminal_v${VERSION}_${DATE}.apk"
          fi
        done
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: XLinuxTerminal-APK
        path: app/build/outputs/apk/release/renamed/*.apk
