name: Build Signed APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Release APK
      run: ./gradlew assembleRelease
    - name: Sign APK with release key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > xlinux.keystore
        for f in app/build/outputs/apk/release/*.apk; do
          if [ -f "$f" ] && [[ "$f" != *"unaligned"* ]]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore xlinux.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$f" xlinux
          fi
        done
        rm -f xlinux.keystore
    - name: Rename APK
      run: |
        VERSION=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
        DATE=$(date +%Y%m%d_%H%M%S)
        mkdir -p app/build/outputs/apk/release/renamed
        for f in app/build/outputs/apk/release/*.apk; do
          if [ -f "$f" ] && [[ "$f" != *"unaligned"* ]]; then
            cp "$f" "app/build/outputs/apk/release/renamed/XLinuxTerminal_v${VERSION}_${DATE}.apk"
          fi
        done
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: XLinuxTerminal-APK
        path: app/build/outputs/apk/release/renamed/*.apk
